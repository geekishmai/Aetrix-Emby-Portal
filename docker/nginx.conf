# 前端 nginx 配置：serve 双前端 + 反代后端 API。
# user_frontend → /usr/share/nginx/html/
# admin_frontend → /usr/share/nginx/html/admin/
# 后端地址由环境变量 BACKEND_HOST 决定（默认 aetrix-api:8000），
# 容器启动时 web-entrypoint.sh 会渲染占位符并生成最终配置。

# 上游后端：keepalive 复用 VPS→后端的 TCP 连接。
# 原来每个 /api/ 请求都用变量式 proxy_pass 新建一条 TCP（跨洋约 +140ms）；
# upstream keepalive 把建连摊掉。${BACKEND_HOST} 由 web-entrypoint.sh 在容器
# 启动时渲染（生产是 AWS 公网 IP，单机部署是 aetrix-api:8000，经 Docker DNS
# 启动时解析；后端 IP 变化需重建本容器）。
# 多域名 / 外层反代（如 Caddy、Cloudflare → Caddy）透传：
# 优先采信上游已写入的 X-Forwarded-Proto 与 X-Forwarded-Host，缺失时才回退到
# 本容器看到的 $scheme（http）与 $host，避免把外层 https 覆盖成 http。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

upstream aetrix_backend {
    server ${BACKEND_HOST};
    keepalive 32;
}

server {
    listen 80;
    # Docker 内置 DNS（单机部署后端容器重建后 IP 会变时兜底；upstream 静态解析为主）
    resolver 127.0.0.11 valid=10s;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩静态资源（2026-10-16 补 text/html：两个 index.html 之前是裸奔的）
    gzip on;
    gzip_types text/css text/html application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端 API：面板/用户端所有 /api/* 请求（^~ 优先于下方静态后缀正则，防止 /api/site/boot.js 等被当成静态文件 404）
    location ^~ /api/ {
        # A-124：后端库封面上传口上限 8MB（portal.py _LIBRARY_COVER_MAX_BYTES），
        # nginx 默认 client_max_body_size 只有 1MB，不覆盖则 1–8MB 的封面
        # 在 nginx 层先被默认 413 页截断、后端 8MB 校验够不着。取 10m 而非 8m：
        # multipart 体比文件本身大，10m 才能让后端校验去产生业务报错。
        client_max_body_size 10m;
        proxy_pass http://aetrix_backend;
        # keepalive 必须配 HTTP/1.1 + 空 Connection 头，否则复用不生效
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # X-Real-IP 必须透传上层写好的值，不许用 $remote_addr 覆盖：双层代理
        # （宿主机 nginx → 本容器 nginx → 后端）时，本容器的 $remote_addr 是
        # docker 网关，覆盖后后端拿到的全是网关 IP，全站用户共用一个限流桶
        # （2026-10-22 注册接口被误拒 429 实证）。只有最外层代理才用
        # $remote_addr 硬写；单层部署时上层没写此头，透传为空，后端回落到
        # X-Forwarded-For 末段 / 直连 IP（见 backend/ratelimit.py）。
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 120s;
    }

    # 单点登录入口（如 /sso/fanqiao?ticket=...）：^~ 优先于静态后缀正则，确保一律转发后端
    location ^~ /sso/ {
        proxy_pass http://aetrix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 60s;
    }

    # Emby 客户端协议路径：/emby/*（^~ 优先于静态后缀正则，防止带 .jpg/.png/.svg 后缀的协议请求落静态目录）
    location ^~ /emby/ {
        proxy_pass http://aetrix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # X-Real-IP 透传上层（同 /api/ 处的说明：双层代理下不许用 $remote_addr 覆盖）
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 300s;
        # 流媒体需要大缓冲关闭，直接透传
        proxy_buffering off;
    }

    # 坏客户端播放地址还原口（2026-11-04，配合 api.py 的 mangled_playback_url_repair）：
    # Yamby 等把 PlaybackInfo 下发的绝对地址当相对路径，拼成
    #   /embyhttps://<本站域名>/emby/Videos/<id>/stream...
    # 这种路径不匹配 /emby/ 前缀（"embyh..." 后面没有斜杠），旧配置落到
    # SPA 兜底返回 index.html（200），API 层的还原口永远收不到请求。
    #
    # 两个要点：
    # 1) 前缀 location 捕获 /embyhttp（http/https 两种 scheme 都覆盖）；
    # 2) **proxy_pass 用 $request_uri 透传原始 URI**：nginx 默认
    #    merge_slashes=on 会把 "://" 合并成 ":/"，直接用归一化后的 URI
    #    转发会让后端 /emby{scheme}://{embedded} 路由匹配不上。$request_uri
    #    是未归一化的原始请求行 URI（含查询串），后端拿到完整 "://"，
    #    由主机白名单还原（名单外 404，不做开放重定向）。
    location /embyhttp {
        proxy_pass http://aetrix_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # HTML 入口禁止启发式缓存：发版或切换品牌配置后每次打开必须拿到最新壳与 chunk 哈希
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }
    location = /admin/index.html {
        alias /usr/share/nginx/html/admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # 管理后台：/admin/* → admin 前端 dist
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin {
        return 301 /admin/;
    }

    # 用户端：SPA，全部回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    # 静态资源长期缓存（Vite 文件名带内容哈希，1y 安全；index.html 不走这条）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

