<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover：没有它，iOS 上 env(safe-area-inset-*) 恒为 0，
         底部导航坞与吸底按钮的“避开小白条”内边距会全部失效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- 移动端浏览器工具栏跟随页面底色（不是品牌色），滚动时不会出现一条亮青色带 -->
    <meta name="theme-color" content="#111111">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="帆桥影院：高清片库在线浏览、多端播放器一键直连与个人观影管理。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="帆桥影院">
    <meta property="og:title" content="帆桥影院">
    <meta property="og:description" content="帆桥影院：高清片库在线浏览、多端播放器一键直连与个人观影管理。">
    <meta property="og:image" content="/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- 标题衬线字：perf 优化（2026-10-13）移除了 Google Fonts 外链。
         原因：<link rel="stylesheet"> 是渲染阻塞的，fonts.googleapis.com
         在国内访问不稳定，会导致整页白屏等它。
         现在用系统字体栈（Songti SC / STSong / SimSun / serif），
         与 Noto Serif SC 同为宋体风格，首屏不再被外部字体卡住。 -->
    <title>帆桥影院</title>
    <script>
      /*
       * 首屏零闪烁预引导（在任何样式绘制与 Vue 挂载之前同步执行）：
       * 1. 并行预拉公开品牌配置 /api/site/branding（零额外串行 RTT），同时用本地缓存预热标题；
       * 2. 精确判定首屏目标骨架表面（portal 暗厅骨架 vs auth 鉴权骨架），全程锁定 #111111 帆桥暗厅底色。
      (function () {
        var docEl = document.documentElement;
        try {
          var bootCtrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          var bootTimer = bootCtrl ? setTimeout(function () { bootCtrl.abort(); }, 2500) : 0;
          window.__AETRIX_BOOT_PROMISE__ = fetch('/api/site/branding', {
            credentials: 'same-origin',
            cache: 'no-store',
            signal: bootCtrl ? bootCtrl.signal : undefined
          }).then(function (r) {
            if (bootTimer) clearTimeout(bootTimer);
            return r.ok ? r.json() : null;
          }).catch(function () {
            if (bootTimer) clearTimeout(bootTimer);
            return null;
          });
        } catch (e) {
          window.__AETRIX_BOOT_PROMISE__ = Promise.resolve(null);
        }

        try {
          var cachedBrand = localStorage.getItem('aetrix:branding:v1');
          if (cachedBrand) {
            var parsedBrand = JSON.parse(cachedBrand);
            if (parsedBrand && parsedBrand.site_name) {
              document.title = parsedBrand.site_name;
            }
          }
        } catch (e) {}

        try {
          var rawPath = (location.pathname || '/').replace(/\/+$/, '') || '/';
          var hasToken = Boolean(localStorage.getItem('access_token'));
          var hasSso = (document.cookie || '').indexOf('aetrix_sso_pending=') !== -1;
          var isAuthPath = rawPath === '/login' || rawPath === '/tg-login' || rawPath === '/privacy';
          var isPublicPortalPath = rawPath === '/want';
          var bootSurface = (!isAuthPath && (hasToken || hasSso || isPublicPortalPath)) ? 'portal' : 'auth';
          docEl.setAttribute('data-boot-mode', bootSurface);
          docEl.removeAttribute('data-theme');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#111111');
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #111111;
        color-scheme: dark;
      }

      #app-boot {
        position: fixed;
        inset: 0;
        background: #111111;
        font: 15px/1.6 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
      }

      .boot-auth {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #9a9a9a;
      }

      .boot-ring {
        width: 20px;
        height: 20px;
        border: 2px solid #2a2a2a;
        border-top-color: #c3f53c;
        animation: boot-spin 0.8s linear infinite;
      }

      .boot-portal {
        display: none;
        width: 100%;
        box-sizing: border-box;
      }

      html[data-boot-mode='portal'] .boot-auth {
        display: none;
      }

      html[data-boot-mode='portal'] .boot-portal {
        display: block;
      }

      .boot-topbar {
        height: 60px;
        padding: 0 clamp(16px, 3.5vw, 48px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #2a2a2a;
        background: #111111;
      }

      .boot-pill {
        border-radius: 2px;
        background: #171717;
        animation: boot-pulse 1.5s ease-in-out infinite;
      }

      .boot-shelf {
        padding: 36px clamp(16px, 3.5vw, 48px) 0;
      }

      .boot-posters {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
        gap: 10px;
        overflow: hidden;
        max-height: 260px;
      }

      .boot-card {
        aspect-ratio: 2 / 3;
        border-radius: 2px;
        background: #171717;
        border: 1px solid #222222;
        animation: boot-pulse 1.5s ease-in-out infinite;
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes boot-pulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.45; }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-ring, .boot-pill, .boot-card { animation: none; }
      }

      #app-noscript {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111111;
        color: #f2f2f2;
        font: 15px/1.6 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-boot" aria-busy="true" aria-label="正在加载页面">
        <div class="boot-auth">
          <span class="boot-ring" aria-hidden="true"></span>
          <span>正在载入…</span>
        </div>
        <div class="boot-portal" aria-hidden="true">
          <div class="boot-topbar">
            <div class="boot-pill" style="width:112px;height:24px"></div>
            <div class="boot-pill" style="width:280px;height:20px;max-width:45vw"></div>
            <div class="boot-pill" style="width:68px;height:28px"></div>
          </div>
          <div class="boot-shelf">
            <div class="boot-pill" style="width:140px;height:22px"></div>
            <div class="boot-posters">
              <div class="boot-card"></div>
              <div class="boot-card"></div>
              <div class="boot-card"></div>
              <div class="boot-card"></div>
              <div class="boot-card"></div>
              <div class="boot-card"></div>
              <div class="boot-card"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <div id="app-noscript">
        <p>请启用 JavaScript 以使用本网站</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
